# Enterprise Data Lake Platform — Presentation Content
# Run: python ./pptx/generate_presentation.py
# All colour values accept either a named colour (e.g. deep_blue) or a hex string (e.g. '#156082')
#
# Rewritten 2026-07-14 against docs/PLATFORM_STATUS.md, docs/PIPELINE_FLOW.md,
# docs/KNOWN_GAPS_AND_ROADMAP.md, docs/EXECUTIVE_OVERVIEW.md, docs/FAQ_FOR_MANAGEMENT.md,
# docs/COST_ANALYSIS_AND_ROI.md, and docs/GLOSSARY_AND_TERMINOLOGY.md — not the prior deck.
# Two corrections vs. the previous version: (1) only 2 of 5 connectors are actually live today
# (Salesforce + MySQL RDS — Sage Intacct, Sage X3, NetSuite are code-complete but have no
# credentials yet), and (2) the Serving Store is a fully built, tested feature (5 database
# engines) that was previously missing from this deck entirely, not a "someday" roadmap item.

output: Enterprise_Data_Lake_Platform_v3.pptx

slides:

  # ── Slide 1 — Title ──────────────────────────────────────────────────────
  - type: title
    title: "Enterprise Data Lake Platform"
    tagline: "Automated  ·  Metadata-Driven  ·  Multi-Tenant  ·  Cloud-Native  ·  Governed"
    description: "A unified, multi-tenant platform connecting Salesforce CRM, MySQL RDS, Sage Intacct, Sage X3, and NetSuite ERP\ninto a single trusted, analytics-ready data foundation, with a governed path to BI tools — built on AWS."
    badges:
      - label: "Dev  ✅  Live"
        color: green_ok
      - label: "Staging  🔲  Not Live"
        color: amber
      - label: "Production  🔲  Not Live"
        color: red
    footer: "Platform Engineering  ·  July 2026"

  # ── Slide 2 — Problem (table + before→after pairs) ───────────────────────
  - type: table
    title: "The Problem We Solved"
    subtitle: "Data lived in silos — disconnected, delayed, and insecure"
    columns:
      - header: "System"
        color: deep_blue
        width: 2.45
      - header: "What it held"
        color: deep_blue
        width: 2.45
      - header: "Who used it"
        color: deep_blue
        width: 2.35
      - header: "Pain point"
        color: deep_blue
        width: 2.85
    rows:
      - ["Salesforce CRM",  "Accounts & contacts",          "Sales, CS",        "Manual exports; no audit trail"]
      - ["MySQL RDS",       "Contracts & orders",            "Operations",       "24–72 hr delay; brittle scripts"]
      - ["Sage Intacct/X3", "AR/AP invoices, vendors",       "Finance",          "Disconnected from CRM"]
      - ["NetSuite ERP",    "Customers, transactions",       "Finance, Ops",     "Siloed from CRM & Sage data"]
      - ["All systems",     "Credentials stored in scripts", "Engineering",      "Security risk, no rotation"]
      - ["All systems",     "Same customer = multiple records", "Analytics",     "No single source of truth"]
    callout: "Result: stale data  ·  no audit trail  ·  no single source of truth  ·  weeks to onboard any new data source"
    pairs:
      - before: "24–72 hr delay"
        after:  "1–4 hr automated"
      - before: "Disconnected views"
        after:  "1 golden record"
      - before: "No audit trail"
        after:  "Full lineage"
      - before: "Credentials in scripts"
        after:  "AWS Secrets Manager"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 3 — Solution Overview (cards + stats strip) ────────────────────
  - type: cards
    title: "What We Built"
    subtitle: "A fully automated, metadata-driven, multi-tenant data lake on AWS — now with a BI-ready serving store"
    cards:
      - title: "Multi-Source\nConnectors"
        color: deep_blue
        body: "Salesforce  ·  MySQL RDS\nSage Intacct  ·  Sage X3  ·  NetSuite\n2 live today, 3 code-complete"
      - title: "5-Stage\nPipeline"
        color: sky
        body: "Extract  →  Transform\n→  Resolve  →  Publish  →  Serve\nAWS Step Functions, 16 documented stages"
      - title: "Entity\nResolution"
        color: purple
        body: "One golden record per\ncustomer — company & person\nlive today, more types ready"
      - title: "Governed\nAnalytics"
        color: orange
        body: "SQL via Athena\nPII masking  ·  Lineage\nQuality report per run"
      - title: "Multi-Tenant\nSaaS Platform"
        color: green
        body: "Every layer tenant-scoped\nSelf-service onboarding API\nIAM-level isolation still open"
      - title: "Serving\nStore"
        color: amber
        body: "5 database engines\nMySQL · Postgres · SQL Server / Azure · Redshift\nCode-complete, $0 AWS cost today"
    stats_strip:
      background: deep_blue
      items:
        - value: "2 of 5"
          label: sources live today
          value_color: white
          label_color: "#CCDDFF"
        - value: "36,023+"
          label: MySQL records live
          value_color: white
          label_color: "#CCDDFF"
        - value: "16 stages"
          label: documented pipeline
          value_color: white
          label_color: "#CCDDFF"
        - value: "1,600"
          label: automated tests passing
          value_color: white
          label_color: "#CCDDFF"
        - value: "~$770–790/mo"
          label: AWS cost (projected)
          value_color: white
          label_color: "#CCDDFF"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 4 — Architecture ────────────────────────────────────────────────
  - type: architecture
    title: "Architecture Overview"
    subtitle: "Event-driven  ·  Serverless  ·  16 documented pipeline stages  ·  Tenant isolation maturing layer by layer"
    rows:
      - label: "SOURCE SYSTEMS"
        description: "Salesforce · MySQL RDS · Sage Intacct · Sage X3 · NetSuite ERP  (2 of 5 live)"
        color: lite_blue
        border_color: deep_blue
      - label: "ORCHESTRATION"
        description: "EventBridge Scheduler → Step Functions  ·  DynamoDB (config, watermark, audit, serving-store)"
        color: lite_purple
        border_color: purple
    layers:
      - label: "RAW LAYER  (S3)"
        description: "Immutable, append-only\nParquet + S3 Object Lock\nHive-partitioned by source/entity\nNot yet tenant-prefixed (open gap)"
        color: lite_green
        border_color: green
      - label: "CURATED LAYER  (S3)"
        description: "Field-mapped (v1.json)\nQuality-evaluated\nPII masked (always-on) · SCD Type 1\nTenant-scoped write paths"
        color: lite_purple
        border_color: purple
      - label: "ANALYTICS LAYER  (S3 + Glue)"
        description: "Golden records\nAthena-queryable, tenant-prefixed tables\nShared Glue databases — isolated by\nnaming convention today, not by access control"
        color: lite_orange
        border_color: orange
      - label: "SERVING STORE  (RDS)"
        description: "Golden records mirrored to a\nrelational DB for BI tools\nMySQL · Postgres · SQL Server / Azure · Redshift\nCode-complete, not yet deployed"
        color: "#FFF3D6"
        border_color: amber
    lambdas:
      - label: "Lambda 1\nExtraction"
        color: deep_blue
      - label: "Lambda 2\nTransformation"
        color: purple
      - label: "Lambda 3\nEntity Resolution"
        color: green
      - label: "Lambda 4\nAnalytics Publisher"
        color: orange
      - label: "Lambda 5\nServing Store Load"
        color: amber
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 5 — Multi-Tenant Isolation ──────────────────────────────────────
  - type: bullets
    title: "Multi-Tenant Isolation"
    subtitle: "Every customer's data, kept apart — honestly scored layer by layer, not just claimed"
    left:
      heading: "What's Genuinely Isolated Today"
      heading_color: deep_blue
      items:
        - "Watermark and entity-type-registry records are isolated at the DynamoDB key level, not just by convention"
        - "A missing or malformed tenant ID fails the request outright — never a silent shared-tenant fallback"
        - "Curated and analytics S3 write paths, and the control-plane API, are tenant-scoped in every code path"
        - "The default tenant (\"demo\") uses the exact same isolation path as any future customer — no special-casing"
        - "Serving-store BI access is isolated at the database-engine level: one database (MySQL) or schema (Postgres/SQL Server/Azure SQL/Redshift) per tenant, with its own read-only credential"
    right:
      heading: "Honest Status — Not Yet Production-Grade"
      heading_color: orange
      items:
        - "Raw-layer S3 objects and Secrets Manager credentials are not tenant-isolated at all yet"
        - "Glue/Athena analytics tables sit in two shared databases — isolated by table-naming convention only, no per-tenant databases or access filters"
        - "No IAM policy anywhere ties a principal to only its own tenant's data — the platform's single largest remaining security gap"
        - "Tenant provisioning has no admin-level authorization check yet — any authenticated caller can create a tenant"
        - "Full layer-by-layer isolation table and every open gap are tracked in the platform's roadmap doc — see the Known Gaps slide"
    code_block: "Key-level isolated: watermark & entity-type registries. Convention-isolated: curated/analytics S3, Glue tables. Engine-isolated: serving-store DBs/schemas. Not isolated: raw S3, Secrets Manager."
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 6 — Self-Service Control Plane ──────────────────────────────────
  - type: split
    title: "Self-Service Control Plane"
    subtitle: "From engineer-run scripts to a secured, self-service REST API"
    left:
      heading: "What Changed"
      heading_color: deep_blue
      items:
        - "Before: onboarding a new customer meant an engineer manually running CLI scripts"
        - "Now: a REST API provisions a tenant, registers entities, and triggers pipeline runs — no engineer required"
        - "Secured behind Amazon Cognito with JWT authentication; every call is authenticated and tenant-scoped"
        - "Runs on the same serverless stack (Lambda + API Gateway) as the rest of the pipeline"
        - "Code-complete and test-covered; a real login/token round-trip against the deployed Cognito pool has not yet been exercised end-to-end"
        - "Open gap: no admin-only check on tenant creation yet — the next hardening step before opening this up broadly"
    right:
      title: "Example: Onboard a New Customer"
      title_color: deep_blue
      background: "#F5F8FF"
      code: |
        POST /tenants
        Authorization: Bearer <JWT>
        { "tenant_code": "acme", "display_name": "Acme Corp" }

        POST /tenants/acme/entities
        { "source_id": "salesforce", "entity_id": "account" }

        POST /tenants/acme/pipeline-runs
        { "source_id": "salesforce", "entity_id": "account" }

        # Every call authenticated via Cognito/JWT
        # tenant_code enforced on every downstream call
    footer_strip: "6 self-service API routes  ·  secured by Cognito/JWT  ·  code-complete, pending live verification"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 7 — Data Sources (cards with footer strip) ─────────────────────
  - type: cards
    title: "Data Source Connectors"
    subtitle: "Pluggable adapter pattern — 2 live today, 3 ready the moment credentials land"
    cards:
      - label: "Salesforce CRM"
        color: deep_blue
        active: true
        show_icon: true
        body: "Live — 34 accounts flowing\nOAuth 2.0 client_credentials, Bulk API 2.0\nEntities: Account, Contact\nOpportunity & Contract mapped, not seeded"
      - label: "MySQL RDS"
        color: green
        active: true
        show_icon: true
        body: "Live — 36,023 contract rows\nAWS Secrets Manager creds, VPC + NAT\nEntity: Contracts (incremental)\nContractTerms mapped, not seeded"
      - label: "Sage Intacct"
        color: purple
        active: false
        show_icon: true
        body: "Code-complete, awaiting credentials\nREST API, OAuth 2.0\nEntities: Customer, Vendor,\nAR Invoice, AP Bill"
      - label: "Sage X3"
        color: orange
        active: false
        show_icon: true
        body: "Code-complete, awaiting credentials\nREST API, OAuth 2.0\nSame SageConnector adapter\nEntities: Customer, Supplier"
      - label: "NetSuite ERP"
        color: amber
        active: false
        show_icon: true
        body: "Code-complete, awaiting credentials\nOAuth 1.0a TBA (HMAC-SHA256)\nSuiteQL, entity: Customer\nPagination-safe up to 100K rows/run"
    footer_strip: "All 5 connectors implement one ExtractionConnector interface — 3 methods to register a new source"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 8 — Extraction (two-column bullets + code block) ───────────────
  - type: bullets
    title: "Pipeline Stage 1 — Extraction"
    subtitle: "Source systems  →  S3 Raw Layer"
    left:
      heading: "Processing Steps"
      heading_color: deep_blue
      items:
        - "Config from DynamoDB: entity_id, load_type, watermark_field"
        - "Credentials from Secrets Manager — never in code"
        - "Metadata discovery validates schema before querying"
        - "Query: full load  or  incremental (watermark window)"
        - "MySQL streams via a server-side cursor with pooled connections — no full-table buffering"
        - "Schema snapshot saved to S3 after each extraction"
        - "Drift detection: added / removed / type-changed columns"
    right:
      heading: "Reliability & Security"
      heading_color: orange
      items:
        - "Circuit breaker (DynamoDB-backed, tenant-scoped) — stops broken sources"
        - "Exponential backoff + jitter on transient errors"
        - "Dead-letter queue (SQS) — auto-processed with audit + SNS alert"
        - "First-run incremental: epoch (1970) lower bound"
        - "S3 Object Lock on raw layer — immutable audit trail"
        - "IAM least-privilege scoped to exact S3 prefixes"
        - "Run audit log entry written to DynamoDB per run"
    code_block: "S3 path:  s3://edl-raw-087972550871/{source}/{entity_id}/extraction_date=YYYY-MM-DD/run_id=.../data.parquet  (not yet tenant-prefixed)"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 9 — Transformation (two-column bullets + code block) ───────────
  - type: bullets
    title: "Pipeline Stage 2 — Transformation"
    subtitle: "Raw Layer  →  Curated Layer  (canonical, quality-checked, PII masked)"
    left:
      heading: "Processing Steps"
      heading_color: deep_blue
      items:
        - "Reads Parquet from raw layer — streaming, no full load"
        - "Field mapping: source → canonical names (v1.json)"
        - "Transforms: CAST · CONCAT · DATE_FORMAT · DIRECT"
        - "Missing field: raise_error / use_default / drop_field"
        - "Quality check: completeness, null rate, type conformance"
        - "PII masking applies to every source, mapped or not — never skippable"
        - "SCD Type 1 merge: partition = full current state"
        - "Lineage record emitted for every run"
    right:
      heading: "Configuration (no code needed)"
      heading_color: orange
      items:
        - "Mappings stored in S3 (curated bucket) — version-controlled"
        - "Path: config/field_mappings/{source}/{entity}/v1.json"
        - "No code change to add a mapping — upload JSON + re-run"
        - "primary_key_field → upsert merge; absent = append"
        - "soft_delete_field → tombstone (is_deleted flag)"
        - "Quality thresholds configurable per entity"
        - "Output: curated_date=YYYY-MM-DD/run_id=.../data.parquet"
    code_block: '{ "source_fields":["AnnualRevenue"], "target_field":"annual_revenue", "transformation":"CAST", "type":"decimal", "missing_field_behavior":"use_default", "default_value":"0" }'
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 10 — Entity Resolution (flow) ──────────────────────────────────
  - type: flow
    title: "Pipeline Stage 3 — Entity Resolution"
    subtitle: "Cross-source deduplication  →  one Golden Record per real-world entity"
    sources:
      - title: "Salesforce Account"
        color: deep_blue
        fields: "account_id\naccount_name\nbilling_country\nis_active · annual_revenue"
      - title: "Sage Intacct Customer"
        color: sky
        fields: "customer_id\ncompany_name\ncredit_limit\noutstanding_balance"
      - title: "Sage X3 Customer"
        color: green
        fields: "customer_code\ncustomer_name\ncountry_code\naccount_manager"
      - title: "NetSuite Customer"
        color: amber
        fields: "customer_id\ncompany_name\nemail_address\nfull_name"
    merge_label: "⬇  MATCH & MERGE  ⬇"
    output:
      label: "🏆  GOLDEN RECORD  —  company entity"
      color: orange
      description: "entity_id  ·  account_name  ·  annual_revenue (Salesforce preferred)  ·  credit_limit (Sage preferred)  ·  outstanding_balance  ·  is_active\nSurvivorship strategies: source_priority · most_recent · longest · first_non_null (configurable per field)"
    bullets:
      - "Blocking + fuzzy name matching, configurable per entity type"
      - "Survivorship: preferred source per field — e.g. Salesforce → is_active, Sage → credit_limit"
      - "Streams curated records via DuckDB — no in-memory full load"
      - "9 entity types defined; only company & person are live today (Salesforce only)"
      - "Output → s3://edl-analytics-.../{tenant_code}/canonical/{entity_type}/golden_date={date}/"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 11 — Analytics Publisher (split) ───────────────────────────────
  - type: split
    title: "Pipeline Stage 4 — Analytics Publisher"
    subtitle: "Golden Records  →  Athena-queryable partitioned tables"
    left:
      heading: "What it does"
      heading_color: deep_blue
      items:
        - "Reads golden records from analytics layer (canonical/ prefix)"
        - "Writes partitioned Parquet: analytics_date=YYYY-MM-DD"
        - "Registers Glue Data Catalog table (edl_analytics)"
        - "Adds Hive partition for the run's analytics_date"
        - "Grants Lake Formation permissions to analytics users — today a wildcard across all tenants, hardening tracked as an open gap"
        - "Emits an end-to-end pipeline SLA metric — extraction start to analytics-ready"
    right:
      title: "Query in Amazon Athena"
      title_color: deep_blue
      background: "#F5F8FF"
      code: |
        -- All companies
        SELECT * FROM edl_analytics.company
          WHERE analytics_date='2026-07-14';

        -- Active contracts only
        SELECT COUNT(*) FROM edl_analytics.contract
          WHERE analytics_date='2026-07-14'
          AND is_deleted = false;

        -- Cross-entity join
        SELECT c.account_name, COUNT(k.contract_id)
        FROM edl_analytics.company c
        JOIN edl_analytics.contract k
          ON c.account_id = k.account_id
        GROUP BY c.account_name;
    footer_strip: "Live today (dev): 34 Salesforce accounts  ·  36,023 MySQL contract rows — queryable via Athena now"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 12 — Serving Store (NEW) ────────────────────────────────────────
  - type: cards
    title: "Pipeline Stage 5 — Serving Store"
    subtitle: "Golden records, mirrored into a relational database — built for direct Power BI / Tableau connections"
    cards:
      - title: "MySQL RDS"
        color: deep_blue
        active: true
        show_icon: true
        body: "Reference engine\nDatabase-per-tenant isolation\nAWS-managed master credential"
      - title: "PostgreSQL"
        color: green
        active: true
        show_icon: true
        body: "Schema-per-tenant isolation\npsycopg driver\nALTER DEFAULT PRIVILEGES covers future tables"
      - title: "SQL Server / Azure SQL"
        color: purple
        active: true
        show_icon: true
        body: "Schema-per-tenant isolation\npymssql driver — no native ODBC layer needed\nMERGE-based upsert, 500-row batches"
      - title: "Amazon Redshift"
        color: orange
        active: true
        show_icon: true
        body: "Schema-per-tenant isolation\nMPP warehouse — bulk S3 COPY → MERGE\nIAM-auth writer (no stored password)\nBuilt for BI at millions-of-rows scale"
      - title: "Hash-Diff\nIncremental Sync"
        color: amber
        active: true
        show_icon: true
        body: "Every row gets a SHA-256 hash\nOnly changed rows are rewritten\nFirst sync per tenant = automatic full backfill"
    below_bullets:
      heading: "Status & Isolation Model — Read This Before Demoing It"
      heading_color: charcoal
      items:
        - "Code-complete and fully tested — lint, types, tests, and terraform validate all pass cleanly"
        - "Zero dollars spent today — no RDS instance, Lambda, or credential exists in AWS yet"
        - "Isolation is engine-enforced: one database or schema per tenant — not an app-level filter, since BI tools connect directly"
        - "Each tenant gets its own read-only reader credential, separate from the writer credential"
        - "Open gap: no network path yet for BI tools to reach the database — needs a Client VPN, new infrastructure work"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 13 — Governance (cards with below bullets) ─────────────────────
  - type: cards
    title: "Data Governance & Security"
    subtitle: "Compliance built into the pipeline — with real, tracked gaps on the path to full tenant isolation"
    cards:
      - title: "PII Masking"
        color: deep_blue
        body: "Applied at transformation — before curated write\nCovers every source, mapped or not\nPolicy version-controlled per entity\nNon-optional — pipeline fails if policy missing"
      - title: "Data Lineage"
        color: sky
        body: "Emitted for every run:\nsource → curated → golden record\nField count, run_id, entity_id, timestamp\nQueryable via Athena or S3"
      - title: "Data Classification"
        color: purple
        body: "Fields: PUBLIC / INTERNAL / CONFIDENTIAL / PII\nApplied at source onboarding\nDrives masking + retention rules\nRegistered in AWS Glue Catalog"
      - title: "Retention Policy"
        color: orange
        body: "Configurable per classification tier\nRaw: S3 Object Lock (immutable)\nCurated/analytics: policy-enforced\nDev: 30-day; Prod: 365-day logs"
    below_bullets:
      heading: "Security Controls — and Their Honest Limits"
      heading_color: charcoal
      items:
        - "All credentials via AWS Secrets Manager — never in code or logs (shared per connector type, not per-tenant yet)"
        - "IAM least-privilege scoped to exact S3/DynamoDB paths — no policy yet enforces tenant-only access (largest open gap)"
        - "Missing or malformed tenant IDs fail the request — never a silent shared-tenant default (OWASP A01)"
        - "All event inputs validated with regex (OWASP A03 injection prevention)"
        - "No record field values ever logged — counts/IDs only (OWASP A09)"
        - "No external security or compliance audit (SOC 2, GDPR, HIPAA) has been performed against this platform yet"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 14 — Observability (features) ──────────────────────────────────
  - type: features
    title: "Observability & Reliability"
    subtitle: "Every run is measurable, traceable, and self-healing"
    left:
      title: "Monitoring"
      title_color: deep_blue
      items:
        - title: "Structured Logging"
          body: "JSON per stage: run_id, entity_id, counts — no raw field values"
        - title: "CloudWatch Metrics"
          body: "Custom namespace: record_count, latency_ms, quality_score"
        - title: "Run Audit Log"
          body: "Immutable DynamoDB record, tenant-scoped: start/end time, count, outcome"
        - title: "Schema Drift Alerts"
          body: "Drift report to S3; CloudWatch alarm on breaking change"
        - title: "Credential Rotation Watchdog"
          body: "Daily check across all connected source secrets; alerts via SNS if overdue"
    right:
      title: "Reliability"
      title_color: orange
      items:
        - title: "Step Functions Retries"
          body: "Automatic retry with exponential backoff + jitter"
        - title: "Dead-Letter Queue"
          body: "Auto-processed: audit record + SNS alert, optional auto-replay"
        - title: "Circuit Breaker"
          body: "DynamoDB-backed, tenant-scoped — stops hammering broken sources"
        - title: "State Machine Guards"
          body: "IsNull checks prevent 0-record extractions cascading"
        - title: "Idempotency"
          body: "Re-running same pipeline = identical output — safe to replay"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 15 — Infrastructure (two-column bullets) ───────────────────────
  - type: bullets
    title: "Infrastructure & DevOps"
    subtitle: "Terraform-managed  ·  Environment-parity  ·  One Lambda zip for all functions"
    left:
      heading: "Infrastructure"
      heading_color: deep_blue
      items:
        - "Terraform ≥ 1.8 — full infrastructure as code"
        - "Modules: iam · storage · networking · lambda · orchestration · control plane · serving-store database & lambda"
        - "Remote state: S3 + DynamoDB lock (single-writer safety)"
        - "Dev: applied & live  ·  Staging/Prod: terraform validates cleanly, not yet provisioned"
        - "New env: init → apply iam → apply lambdas → apply orchestration"
        - "One Lambda zip serves all 8 functions (different handlers)"
        - "Build: make lambda-package  →  Upload: make lambda-upload"
    right:
      heading: "Developer Experience & CI"
      heading_color: orange
      items:
        - "Python 3.14, hatchling build system, pyproject.toml"
        - "Tests: pytest + moto (AWS mocks) — 1,600 passing, 1 deliberate skip, 80% coverage gate enforced"
        - "Lint: ruff — zero violations repo-wide  ·  Security: bandit + detect-secrets"
        - "Types: mypy (scoped) — 72 known pre-existing errors tracked as separate debt, not blocking merges"
        - "Banned generic identifiers (helper/util/manager/common) blocked in CI"
        - "Local dry-run scripts — test connectivity, no S3 write"
        - "CI: lint → banned-names → type-check → test → security scan"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 16 — Live Data (metrics + table) ───────────────────────────────
  - type: metrics
    title: "Live Data — Dev Environment"
    subtitle: "Real business data flowing end-to-end  ·  as of July 2026"
