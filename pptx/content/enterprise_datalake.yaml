# Enterprise Data Lake Platform — Presentation Content
# Run: python ./pptx/generate_presentation.py
# All colour values accept either a named colour (e.g. deep_blue) or a hex string (e.g. '#156082')

output: Enterprise_Data_Lake_Platform_v2.pptx

slides:

  # ── Slide 1 — Title ──────────────────────────────────────────────────────
  - type: title
    title: "Enterprise Data Lake Platform"
    tagline: "Automated  ·  Metadata-Driven  ·  Multi-Tenant  ·  Cloud-Native  ·  Governed"
    description: "A unified, multi-tenant platform connecting Salesforce CRM, MySQL RDS, Sage ERP, and NetSuite ERP\ninto a single trusted, analytics-ready data foundation — built on AWS."
    badges:
      - label: "Dev  ✅  Live"
        color: green_ok
      - label: "Staging  🔲  Next"
        color: amber
      - label: "Production  🔲  Planned"
        color: red
    footer: "Platform Engineering  ·  July 2026"

  # ── Slide 2 — Problem (table + before→after pairs) ───────────────────────
  - type: table
    title: "The Problem We Solved"
    subtitle: "Data lived in silos — disconnected, delayed, and insecure"
    columns:
      - header: "System"
        color: deep_blue
        width: 2.45
      - header: "What it held"
        color: deep_blue
        width: 2.45
      - header: "Who used it"
        color: deep_blue
        width: 2.35
      - header: "Pain point"
        color: deep_blue
        width: 2.85
    rows:
      - ["Salesforce CRM",  "Accounts & contacts",          "Sales, CS",        "Manual exports; no audit trail"]
      - ["MySQL RDS",       "Contracts & orders",            "Operations",       "24–72 hr delay; brittle scripts"]
      - ["Sage Intacct/X3", "AR/AP invoices, vendors",       "Finance",          "Disconnected from CRM"]
      - ["NetSuite ERP",    "Customers, transactions",       "Finance, Ops",     "Siloed from CRM & Sage data"]
      - ["All systems",     "Credentials stored in scripts", "Engineering",      "Security risk, no rotation"]
      - ["All systems",     "Same customer = 4 records",     "Analytics",        "No single source of truth"]
    callout: "Result: stale data  ·  no audit trail  ·  no single source of truth  ·  weeks to onboard any new data source"
    pairs:
      - before: "24–72 hr delay"
        after:  "1–4 hr automated"
      - before: "4 disconnected views"
        after:  "1 golden record"
      - before: "No audit trail"
        after:  "Full lineage"
      - before: "Credentials in scripts"
        after:  "AWS Secrets Manager"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 3 — Solution Overview (cards + stats strip) ────────────────────
  - type: cards
    title: "What We Built"
    subtitle: "A fully automated, metadata-driven, multi-tenant data lake on AWS"
    cards:
      - title: "Multi-Source\nConnectors"
        color: deep_blue
        body: "Salesforce  ·  MySQL RDS\nSage Intacct  ·  Sage X3  ·  NetSuite\nOAuth 2.0 / REST / JWT / TBA"
      - title: "4-Stage\nPipeline"
        color: sky
        body: "Extract  →  Transform\n→  Resolve  →  Publish\nAWS Step Functions"
      - title: "Entity\nResolution"
        color: purple
        body: "One golden record per\ncustomer across all\nsource systems"
      - title: "Governed\nAnalytics"
        color: orange
        body: "SQL via Athena\nPII masking  ·  Lineage\nQuality report per run"
      - title: "Multi-Tenant\nSaaS Platform"
        color: green
        body: "Every layer isolated\nby tenant_code  ·  self-service\nonboarding API"
    stats_strip:
      background: deep_blue
      items:
        - value: "5 sources"
          label: connected
          value_color: white
          label_color: "#CCDDFF"
        - value: "35,971+"
          label: records live
          value_color: white
          label_color: "#CCDDFF"
        - value: "0 code"
          label: to add a source
          value_color: white
          label_color: "#CCDDFF"
        - value: "< 4 hrs"
          label: end-to-end
          value_color: white
          label_color: "#CCDDFF"
        - value: "~$469/mo"
          label: AWS cost
          value_color: white
          label_color: "#CCDDFF"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 4 — Architecture ────────────────────────────────────────────────
  - type: architecture
    title: "Architecture Overview"
    subtitle: "Event-driven  ·  Serverless  ·  Tenant-isolated data layers"
    rows:
      - label: "SOURCE SYSTEMS"
        description: "Salesforce CRM  ·  MySQL RDS  ·  Sage Intacct  ·  Sage X3  ·  NetSuite ERP"
        color: lite_blue
        border_color: deep_blue
      - label: "ORCHESTRATION"
        description: "Amazon EventBridge Scheduler  →  AWS Step Functions state machine  ·  DynamoDB (config, watermark, audit log)"
        color: lite_purple
        border_color: purple
    layers:
      - label: "RAW LAYER  (S3)"
        description: "Immutable, append-only\nParquet + S3 Object Lock\nTenant-scoped, Hive-partitioned\nSchema snapshots + drift reports"
        color: lite_green
        border_color: green
      - label: "CURATED LAYER  (S3)"
        description: "Field-mapped (v1.json)\nQuality-evaluated\nPII masked (always-on) · SCD Type 1\nTenant-scoped canonical keys"
        color: lite_purple
        border_color: purple
      - label: "ANALYTICS LAYER  (S3 + Glue)"
        description: "Golden records\nAthena-queryable tables\nTenant-scoped, partitioned by date\nLake Formation access control"
        color: lite_orange
        border_color: orange
    lambdas:
      - label: "Lambda 1\nExtraction"
        color: deep_blue
      - label: "Lambda 2\nTransformation"
        color: purple
      - label: "Lambda 3\nEntity Resolution"
        color: green
      - label: "Lambda 4\nAnalytics Publisher"
        color: orange
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 5 — Multi-Tenant Isolation (NEW) ────────────────────────────────
  - type: bullets
    title: "Multi-Tenant Isolation"
    subtitle: "Every customer's data, kept apart — tenant_code threads through every layer, queue, and schedule"
    left:
      heading: "What This Means for Customers"
      heading_color: deep_blue
      items:
        - "Each customer (tenant) gets its own data path in every layer — raw, curated, and golden records"
        - "One tenant's pipeline failure, retry, or schedule can never touch another tenant's data or runs"
        - "A missing or malformed tenant ID now fails the request — it never silently falls back to shared data"
        - "Entity types, watermarks, and run history are tracked per tenant, not shared globally"
        - "The default tenant (\"demo\") uses the exact same isolation path as any future customer — no special-casing"
    right:
      heading: "Hardened in This Release"
      heading_color: orange
      items:
        - "Fixed: shared watermark keys, S3 write paths, and Glue catalog names that could let two tenants overwrite each other's data"
        - "Fixed: schedule names, circuit-breaker keys, and queue/execution IDs that could cross-contaminate between tenants"
        - "Fixed: PII masking now applies even to sources with no explicit field-mapping rules — no bypass by omission"
        - "Added: an automated cross-tenant isolation test suite, run in CI on every change"
        - "Open item: isolation is enforced by application logic today, not yet backed by IAM — the top remaining item before scaling to many tenants"
    code_block: "Isolation now covers: S3 raw/curated/analytics prefixes · DynamoDB watermark & entity-type keys · schedules · circuit breakers · queues"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 6 — Self-Service Control Plane (NEW) ────────────────────────────
  - type: split
    title: "Self-Service Control Plane"
    subtitle: "From engineer-run scripts to a secured, self-service REST API"
    left:
      heading: "What Changed"
      heading_color: deep_blue
      items:
        - "Before: onboarding a new customer meant an engineer manually running CLI scripts"
        - "Now: a REST API provisions a tenant, registers entities, and triggers pipeline runs — no engineer required"
        - "Secured behind Amazon Cognito with JWT authentication; every call is authenticated and tenant-scoped"
        - "Runs on the same serverless stack (Lambda + API Gateway) as the rest of the pipeline"
        - "Code-complete and test-covered; not yet exercised against a live deployment — the next step before onboarding a real second customer"
    right:
      title: "Example: Onboard a New Customer"
      title_color: deep_blue
      background: "#F5F8FF"
      code: |
        POST /tenants
        Authorization: Bearer <JWT>
        { "tenant_code": "acme", "display_name": "Acme Corp" }

        POST /tenants/acme/entities
        { "source_id": "salesforce", "entity_id": "account" }

        POST /tenants/acme/pipeline-runs
        { "source_id": "salesforce", "entity_id": "account" }

        # Every call authenticated via Cognito/JWT
        # tenant_code enforced on every downstream call
    footer_strip: "6 self-service API routes  ·  secured by Cognito/JWT  ·  code-complete, pending live verification"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 7 — Data Sources (cards with footer strip) ─────────────────────
  - type: cards
    title: "Data Source Connectors"
    subtitle: "Pluggable adapter pattern — add a new source without changing the pipeline"
    cards:
      - label: "Salesforce CRM"
        color: deep_blue
        active: true
        show_icon: true
        body: "OAuth 2.0 client_credentials\nBulk API 2.0 (async CSV)\nEntities: Account, Contact\nWatermark: SystemModstamp"
      - label: "MySQL RDS"
        color: green
        active: true
        show_icon: true
        body: "AWS Secrets Manager creds\nVPC + NAT Gateway\nEntity: Contracts (incremental)\nWatermark: ModifiedOn"
      - label: "Sage Intacct"
        color: purple
        active: true
        show_icon: true
        body: "REST API, OAuth 2.0\nEntities: Customer, Vendor,\nAR Invoice, AP Bill\nWatermark: auditInfo.modifiedAt"
      - label: "Sage X3"
        color: orange
        active: true
        show_icon: true
        body: "REST API, OAuth 2.0\nEntities: Customer, Supplier\nSame SageConnector adapter\nWatermark incremental"
      - label: "NetSuite ERP"
        color: amber
        active: true
        show_icon: true
        body: "OAuth 1.0a TBA (HMAC-SHA256)\nSuiteQL incremental extraction\nEntity: Customer (any record type)\nSafe pagination up to 100K rows/run"
    footer_strip: "All connectors implement ExtractionConnector  ·  3 methods to register a new source"

  # ── Slide 8 — Extraction (two-column bullets + code block) ───────────────
  - type: bullets
    title: "Pipeline Stage 1 — Extraction"
    subtitle: "Source systems  →  S3 Raw Layer"
    left:
      heading: "Processing Steps"
      heading_color: deep_blue
      items:
        - "Config from DynamoDB: entity_id, load_type, watermark_field"
        - "Credentials from Secrets Manager — never in code"
        - "Metadata discovery validates schema before querying"
        - "Query: full load  or  incremental (watermark window)"
        - "MySQL streams via a server-side cursor with pooled connections — no full-table buffering"
        - "Schema snapshot saved to S3 after each extraction"
        - "Drift detection: added / removed / type-changed columns"
    right:
      heading: "Reliability & Security"
      heading_color: orange
      items:
        - "Circuit breaker (DynamoDB-backed, tenant-scoped) — stops broken sources"
        - "Exponential backoff + jitter on transient errors"
        - "Dead-letter queue (SQS) — auto-processed with audit + SNS alert"
        - "First-run incremental: epoch (1970) lower bound"
        - "S3 Object Lock on raw layer — immutable audit trail"
        - "IAM least-privilege scoped to exact S3 prefixes"
        - "Run audit log entry written to DynamoDB per run"
    code_block: "S3 path:  s3://edl-raw-087972550871/{tenant_code}/{source}/{entity_id}/extraction_date=YYYY-MM-DD/run_id=.../data.parquet"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 9 — Transformation (two-column bullets + code block) ───────────
  - type: bullets
    title: "Pipeline Stage 2 — Transformation"
    subtitle: "Raw Layer  →  Curated Layer  (canonical, quality-checked, PII masked)"
    left:
      heading: "Processing Steps"
      heading_color: deep_blue
      items:
        - "Reads Parquet from raw layer — streaming, no full load"
        - "Field mapping: source → canonical names (v1.json)"
        - "Transforms: CAST · CONCAT · DATE_FORMAT · DIRECT"
        - "Missing field: raise_error / use_default / drop_field"
        - "Quality check: completeness, null rate, type conformance"
        - "PII masking applies to every source, mapped or not — never skippable"
        - "SCD Type 1 merge: partition = full current state"
        - "Lineage record emitted for every run"
    right:
      heading: "Configuration (no code needed)"
      heading_color: orange
      items:
        - "Mappings stored in S3 (curated bucket) — version-controlled"
        - "Path: config/field_mappings/{source}/{entity}/v1.json"
        - "No code change to add a mapping — upload JSON + re-run"
        - "primary_key_field → upsert merge; absent = append"
        - "soft_delete_field → tombstone (is_deleted flag)"
        - "Quality thresholds configurable per entity"
        - "Output: curated_date=YYYY-MM-DD/run_id=.../data.parquet"
    code_block: '{ "source_fields":["AnnualRevenue"], "target_field":"annual_revenue", "transformation":"CAST", "type":"decimal", "missing_field_behavior":"use_default", "default_value":"0" }'
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 10 — Entity Resolution (flow) ──────────────────────────────────
  - type: flow
    title: "Pipeline Stage 3 — Entity Resolution"
    subtitle: "Cross-source deduplication  →  one Golden Record per real-world entity"
    sources:
      - title: "Salesforce Account"
        color: deep_blue
        fields: "account_id\naccount_name\nbilling_country\nis_active · annual_revenue"
      - title: "Sage Intacct Customer"
        color: sky
        fields: "customer_id\ncompany_name\ncredit_limit\noutstanding_balance"
      - title: "Sage X3 Customer"
        color: green
        fields: "customer_code\ncustomer_name\ncountry_code\naccount_manager"
      - title: "NetSuite Customer"
        color: amber
        fields: "customer_id\ncompany_name\nemail_address\nfull_name"
    merge_label: "⬇  MATCH & MERGE  ⬇"
    output:
      label: "🏆  GOLDEN RECORD  —  company entity"
      color: orange
      description: "entity_id  ·  account_name  ·  annual_revenue (Salesforce preferred)  ·  credit_limit (Sage preferred)  ·  outstanding_balance  ·  is_active\nSurvivorship policy: configurable field-level source preference per entity type"
    bullets:
      - "Blocking + fuzzy name matching — configurable per entity type"
      - "Survivorship: preferred source per field (Salesforce → is_active; Sage → credit_limit)"
      - "Streams curated records via DuckDB rather than loading them all into memory"
      - "Entity types: company  ·  person  ·  contract  —  extensible via config"
      - "Output → s3://edl-analytics-087972550871/{tenant_code}/canonical/{entity_type}/golden_date={date}/"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 11 — Analytics Publisher (split) ───────────────────────────────
  - type: split
    title: "Pipeline Stage 4 — Analytics Publisher"
    subtitle: "Golden Records  →  Athena-queryable partitioned tables"
    left:
      heading: "What it does"
      heading_color: deep_blue
      items:
        - "Reads golden records from analytics layer (canonical/ prefix)"
        - "Writes partitioned Parquet: analytics_date=YYYY-MM-DD"
        - "Registers Glue Data Catalog table (edl_analytics)"
        - "Adds Hive partition for the run's analytics_date"
        - "Grants Lake Formation permissions to analytics users"
        - "Emits an end-to-end pipeline SLA metric — extraction start to analytics-ready"
    right:
      title: "Query in Amazon Athena"
      title_color: deep_blue
      background: "#F5F8FF"
      code: |
        -- All companies
        SELECT * FROM edl_analytics.company
          WHERE analytics_date='2026-07-02';

        -- Active contracts only
        SELECT COUNT(*) FROM edl_analytics.contract
          WHERE analytics_date='2026-07-02'
          AND is_deleted = false;

        -- Cross-entity join
        SELECT c.account_name, COUNT(k.contract_id)
        FROM edl_analytics.company c
        JOIN edl_analytics.contract k
          ON c.account_id = k.tenant_id
        GROUP BY c.account_name;
    footer_strip: "Live today (dev):  34 companies  ·  49 persons  ·  35,971 contracts  — queryable via Athena right now"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 12 — Governance (cards with below bullets) ─────────────────────
  - type: cards
    title: "Data Governance & Security"
    subtitle: "Compliance built into the pipeline — not bolted on afterwards"
    cards:
      - title: "PII Masking"
        color: deep_blue
        body: "Applied at transformation — before curated write\nCovers every source, mapped or not\nPolicy version-controlled per entity\nNon-optional — pipeline fails if policy missing"
      - title: "Data Lineage"
        color: sky
        body: "Emitted for every run:\nsource → curated → golden record\nField count, run_id, entity_id, timestamp\nQueryable via Athena or S3"
      - title: "Data Classification"
        color: purple
        body: "Fields: PUBLIC / INTERNAL / CONFIDENTIAL / PII\nApplied at source onboarding\nDrives masking + retention rules\nRegistered in AWS Glue Catalog"
      - title: "Retention Policy"
        color: orange
        body: "Configurable per classification tier\nRaw: S3 Object Lock (immutable)\nCurated/analytics: policy-enforced\nDev: 30-day; Prod: 365-day logs"
    below_bullets:
      heading: "Security Controls"
      heading_color: charcoal
      items:
        - "All credentials via AWS Secrets Manager — never in code or logs"
        - "IAM least-privilege: roles scoped to exact S3 prefixes and DynamoDB tables"
        - "Only designated Lambda role can write to each S3 layer"
        - "Missing or malformed tenant IDs fail the request — never a silent shared-tenant default (OWASP A01)"
        - "All event inputs validated with regex (OWASP A03 injection prevention)"
        - "No record field values ever logged — counts/IDs only (OWASP A09)"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 13 — Observability (features) ──────────────────────────────────
  - type: features
    title: "Observability & Reliability"
    subtitle: "Every run is measurable, traceable, and self-healing"
    left:
      title: "Monitoring"
      title_color: deep_blue
      items:
        - title: "Structured Logging"
          body: "JSON per stage: run_id, entity_id, counts — no raw field values"
        - title: "CloudWatch Metrics"
          body: "Custom namespace: record_count, latency_ms, quality_score"
        - title: "Run Audit Log"
          body: "Immutable DynamoDB record, tenant-scoped: start/end time, count, outcome"
        - title: "Schema Drift Alerts"
          body: "Drift report to S3; CloudWatch alarm on breaking change"
        - title: "Credential Rotation Watchdog"
          body: "Daily check across all 5 source secrets; alerts via SNS if overdue"
    right:
      title: "Reliability"
      title_color: orange
      items:
        - title: "Step Functions Retries"
          body: "Automatic retry with exponential backoff + jitter"
        - title: "Dead-Letter Queue"
          body: "Auto-processed: audit record + SNS alert, optional auto-replay"
        - title: "Circuit Breaker"
          body: "DynamoDB-backed, tenant-scoped — stops hammering broken sources"
        - title: "State Machine Guards"
          body: "IsNull checks prevent 0-record extractions cascading"
        - title: "Idempotency"
          body: "Re-running same pipeline = identical output — safe to replay"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 14 — Infrastructure (two-column bullets) ───────────────────────
  - type: bullets
    title: "Infrastructure & DevOps"
    subtitle: "Terraform-managed  ·  Environment-parity  ·  One Lambda zip for all functions"
    left:
      heading: "Infrastructure"
      heading_color: deep_blue
      items:
        - "Terraform ≥ 1.8 — full infrastructure as code"
        - "Modules: iam · storage · networking · lambda · orchestration · control plane"
        - "Remote state: S3 + DynamoDB lock (single-writer safety)"
        - "3 environments: dev / staging / prod — all now terraform validate cleanly"
        - "New env: init → apply iam → apply lambdas → apply orchestration"
        - "One Lambda zip serves all 8 functions (different handlers)"
        - "Build: make lambda-package  →  Upload: make lambda-upload"
    right:
      heading: "Developer Experience & CI"
      heading_color: orange
      items:
        - "Python 3.14, hatchling build system, pyproject.toml"
        - "Tests: pytest + moto (AWS mocks) — 1,522 passing, 96%+ coverage"
        - "Lint: ruff  ·  Types: mypy (scoped)  ·  Security: bandit + detect-secrets"
        - "Banned generic identifiers (helper/util/manager) blocked in CI"
        - "Coverage gate: 80% — enforced in CI"
        - "Local dry-run scripts — test connectivity, no S3 write"
        - "CI: lint → banned-names → type-check → test → security scan"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 15 — Live Data (metrics + table) ───────────────────────────────
  - type: metrics
    title: "Live Data — Dev Environment"
    subtitle: "Real business data flowing end-to-end  ·  as of July 2026"
    metrics:
      - value: "35,971+"
        label: "Contracts\n(MySQL RDS)"
        color: green_ok
      - value: "34"
        label: "Companies\n(Salesforce)"
        color: deep_blue
      - value: "49"
        label: "Persons\n(Salesforce)"
        color: sky
      - value: "4"
        label: "Sources\nconnected"
        color: purple
      - value: "< 4 hrs"
        label: "End-to-end\nlatency"
        color: orange
      - value: "0"
        label: "Mapping\nfailures"
        color: green_lite
    table:
      headers: ["Entity", "Load type", "Records", "Athena table", "Status"]
      widths:  [2.65, 1.75, 1.5, 2.8, 0.68]
      row_height: 0.36
      rows:
        - ["MySQL — Contracts",     "Incremental (SCD1)", "35,971", "edl_analytics.contract",         "✅"]
        - ["Salesforce Account",    "Full load",          "34",     "edl_analytics.company",           "✅"]
        - ["Salesforce Contact",    "Incremental",        "49",     "edl_analytics.person",            "✅"]
        - ["Sage Intacct Customer", "Incremental",        "Live",   "edl_analytics.company (merged)",  "✅"]
        - ["Sage Intacct Vendor",   "Incremental",        "Live",   "Curated layer",                       "✅"]
        - ["NetSuite — Customer",   "Incremental (SCD1)", "Built",  "edl_analytics.company (ready)",   "🔲"]
    note: "Athena workgroup: EdlAnalytics  ·  Database: edl_analytics  ·  Account: 087972550871 / us-east-1"
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 16 — Business Outcomes & ROI (table) ───────────────────────────
  - type: table
    title: "Business Outcomes & ROI"
    subtitle: "Measurable improvements delivered — compared to before the platform"
    row_height: 0.42
    columns:
      - header: "Metric"
        color: charcoal
        width: 3.3
      - header: "Before"
        color: red
        width: 3.05
      - header: "After"
        color: green_ok
        width: 3.75
    rows:
      - ["Time to data availability", "24–72 hours (manual)",              "1–4 hours (automated)"]
      - ["Customer identity",         "3 disconnected views per system",   "Single golden record"]
      - ["PII in analytics",          "Uncontrolled",                      "Masked at pipeline level, always-on"]
      - ["Audit trail",               "None",                              "Full lineage: source→golden"]
      - ["New source onboarding",     "2–4 weeks (code + deploy)",         "2–3 days (config only)"]
      - ["New customer onboarding",   "Shared environment, no isolation",  "Self-service API, tenant-isolated"]
      - ["Credential security",       "Scripts + shared .env files",       "AWS Secrets Manager"]
    callout:
      background: "#F0F4F8"
      parts:
        - text: "AWS Infrastructure: ~$469/month  ·  vs. Fivetran SaaS: $3,000–$5,000/month per source"
          bold: false
          color: text
        - text: "Payback: < 1 month  ·  Plus 40–60 hrs/month avoided labour cost"
          bold: false
          color: muted
        - text: "10× cost saving vs. SaaS — with full ownership and control"
          bold: true
          color: orange
    footer: "Enterprise Data Lake Platform  ·  July 2026"

  # ── Slide 17 — Tech Stack (cards, 6 narrow) ───────────────────────────────
  - type: cards
    title: "Technology Stack"
    subtitle: "Purpose-built on proven AWS-native services and open standards"
    cards:
      - title: "Runtime"
        color: deep_blue
        body: "Python 3.14 — AWS Lambda\nPyArrow — Parquet I/O\nDuckDB — streaming reads\nPydantic — config validation"
      - title: "Orchestration"
        color: sky
        body: "AWS Step Functions\nAmazon EventBridge\nAWS Lambda (8 fn, 1 zip)"
      - title: "Storage"
        color: purple
        body: "Amazon S3 (3 data layers)\nAmazon DynamoDB (4 tables)\nAWS Glue Data Catalog"
