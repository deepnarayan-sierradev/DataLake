name: CI — Lint, Type Check, Test, Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, uat, prod]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.6"

jobs:
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.16.0"

      - name: Run ruff lint
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  banned-names:
    name: "Banned Identifiers (helper/util/common/manager)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run banned-names check
        run: make banned-names

  wiring-gates:
    name: "Wiring Gates (reachability / fail-open / traceability)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Module reachability (G1)
        run: python scripts/check_module_reachability.py

      - name: No fail-open security defaults (G4)
        run: python scripts/check_fail_open_defaults.py

      - name: Requirement traceability (G5)
        run: python scripts/check_requirement_traceability.py

      - name: Filtered security columns are written (G7)
        run: python scripts/check_security_column_writers.py

      - name: Paging primitive is the only paging implementation (G8)
        run: python scripts/check_paging_primitive.py

      - name: Clients are built inside the tenant boundary (G9)
        run: python scripts/check_tenant_session_adoption.py

      - name: CI can resolve what its workflows reference (G12)
        run: python scripts/check_workflow_integrity.py

  typecheck:
    name: "Type Check (mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: |
          mypy -p connector_runtime -p transformation -p entity_resolution \
               -p analytics_publisher -p orchestration -p observability \
               -p watermark_management -p schema_management -p contracts -p governance \
               -p tenancy -p config_propagation -p data_quality \
               -p workflow_automation -p portability -p semantic -p serving_store \
               -p knowledge -p persistence -p processing_engine

      - name: Type check operational scripts
        run: make typecheck-scripts

  test:
    name: "Unit Tests (pytest ≥80% coverage)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml

  security-sast:
    name: "Security SAST (bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install bandit
        run: pip install "bandit[toml]>=1.7"

      - name: Run bandit
        run: bandit -r . --exclude .venv,tests,dist -c pyproject.toml -f json -o bandit-report.json
        continue-on-error: false  # Hard failure on any finding

      - name: Upload bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  dependency-scan:
    name: "Dependency Scan (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies and pip-audit
        run: pip install -e ".[dev]" pip-audit>=2.7 pip-tools>=7.4

      - name: Run pip-audit
        run: pip-audit --strict --require-hashes -r requirements.lock

  iac-security-scan:
    name: "IaC Security Scan (checkov)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run checkov
        uses: bridgecrewio/checkov-action@5fa28e9c4db2c0920ade6ae453c0e91745c6378a  # v12.2847.0
        with:
          directory: infrastructure/
          framework: terraform
          output_format: cli
          soft_fail: false        # Hard failure on any HIGH/CRITICAL finding
          download_external_modules: false

  terraform-validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, uat, prod]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "~1.8"

      - name: Terraform init (no backend)
        working-directory: infrastructure/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform fmt check
        working-directory: infrastructure/
        run: terraform fmt -recursive -check

  secret-scan:
    name: "Secret Scan (detect-secrets)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install detect-secrets
        run: pip install "detect-secrets @ git+https://github.com/Yelp/detect-secrets@01886c8a910c64595c47f186ca1ffc0b77fa5458"

      - name: Run detect-secrets against the committed baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
